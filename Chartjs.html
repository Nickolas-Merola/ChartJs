<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <link rel="stylesheet" href="Chartjs.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  </head>
  <body>
    <h1>Dashboard</h1>

    <div class="divisao_tela">
      <div class="grafico">
        <canvas id="myChart"></canvas>
      </div>
      <div class="grafico">
        <canvas id="myChart2"></canvas>
      </div>
    </div>

    <script>
      const ctx = document.getElementById("myChart");
      new Chart(ctx, {
        type: "line",
        data: {
          labels: ["12:00", "13:00", "14:00", "15:00", "16:00", "17:00"],
          datasets: [
            { label: "Temperatura °C", data: [30, 29, 28, 25, 22, 23], borderColor:'orange',backgroundColor: 'rgba(255, 0, 0, 0.2)',pointBackgroundColor: 'darkorange',  },
            { label: "Umidade (%)", data: [80, 82, 80, 85, 80, 83], borderColor:'blue',backgroundColor: 'rgba(255, 0, 0, 0.2)',pointBackgroundColor: 'darkblue',  },
            // pesquisei para customizar os graficos
          ],
        },
        options: {
          maintainAspectRatio: false,
          scales: { y: { beginAtZero: true } },
        },
      });

      const ctx1 = document.getElementById("myChart2");
      new Chart(ctx1, {
        type: "bar",
        data: {
          labels: ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho"],
          datasets: [
            { label: "Temperatura média °C", data: [22, 24, 27, 23, 20, 18], backgroundColor:'orange', },
            { label: "Umidade média (%)", data: [90, 89, 93, 87, 88, 82], backgroundColor:'blue' },
          ],
        },
        options: {
          maintainAspectRatio: false,
          scales: { y: { beginAtZero: true } },
        },
      });
    </script>
  </body>
</html>
